name: Resolve release inputs
on:
  push:
    branches: [release-bootstrap]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Export lockfile
        run: |
          file=package-lock.json
          printf 'PWE_BEGIN %s %s\n' "$file" "$(git hash-object "$file")"
          base64 -w 1000 "$file"
          printf '\nPWE_END %s\n' "$file"
      - name: Verify core
        run: |
          npm run check
          npm test
