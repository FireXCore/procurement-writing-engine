name: Persian full-corpus experiment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mana-full-experiment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    name: Mana full-corpus / one bounded experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Install isolated comparison dependencies
        run: |
          npm ci --prefix lab/faspell --ignore-scripts --no-fund --no-audit
          npm audit --prefix lab/faspell --audit-level=high
      - name: Fetch only locked evaluation inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/faspell"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const m=JSON.parse(readFileSync('lab/faspell/sources.json','utf8'));
          for(const f of m.files){
            if(!['human','ocr'].includes(f.id)||!f.url.startsWith('https://lindat.mff.cuni.cz/repository/server/api/core/bitstreams/'))throw Error('Unexpected source');
            execFileSync('curl',['--fail','--silent','--show-error','--proto','=https','--max-time','60','--max-filesize','200000','--output',process.env.RUNNER_TEMP+'/faspell/'+f.id+'.txt',f.url],{stdio:'inherit'});
          }
          JS
      - name: Build pinned ManaTTS sample evidence (no audio)
        run: |
          curl --fail --silent --show-error --proto '=https' --max-time 60 --max-filesize 20000 --output "$RUNNER_TEMP/mana.csv" https://raw.githubusercontent.com/MahtaFetrat/ManaTTS-Persian-Speech-Dataset/5ee92110143b01cdf46ee27e0df1cb7ebb39a7f0/sample_data/metadata.csv
          node lab/mana/run.mjs "$RUNNER_TEMP/mana.csv"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install isolated Parquet reader
        run: |
          python -m pip install --only-binary=:all: --no-deps pyarrow==22.0.0
      - name: Test exact-range reader
        run: python -m unittest discover -s lab/mana -p 'test_project_text.py'
      - name: Project full pinned corpus (strict 128 MiB range budget)
        run: |
          python lab/mana/project_text.py "$RUNNER_TEMP/mana-projected.json"
          node lab/mana/full.mjs "$RUNNER_TEMP/mana-projected.json"
          rm -f "$RUNNER_TEMP/mana-projected.json"
      - run: node lab/faspell/run.mjs "$RUNNER_TEMP/faspell" qualification-artifacts/mana-sample-frequency.json qualification-artifacts/mana-full-frequency.json
        env:
          PWE_COMPARE_PROFILE: frequency
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mana-full-comparison
          path: |
            qualification-artifacts/faspell-comparison.json
            qualification-artifacts/mana-sample-frequency.json
            qualification-artifacts/mana-full-frequency.json
            lab/faspell/package-lock.json
          retention-days: 14
