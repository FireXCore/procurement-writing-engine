name: CI
on:
  push:
    branches: [main, 'dev/alpha-5-acceptance']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    name: Core / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
  upstream-and-browser:
    name: Locked upstream / Chromium / security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run typecheck
      - run: npm run test:upstream
      - run: npm run build:demo
      - run: npm run test:browser
      - run: npm audit --audit-level=high
      - run: npm run release:check
      - name: Install packed SDK in clean consumer
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          npm pack --ignore-scripts --pack-destination "$tmp"
          cd "$tmp"
          printf '%s\n' '{"name":"pwe-consumer-smoke","version":"0.0.0","private":true,"type":"module"}' > package.json
          npm install --ignore-scripts --no-audit --no-fund "./procurement-writing-engine-0.1.0-alpha.6.tgz" harper.js@3.2.0 virastar@0.22.1
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {binaryInlined} from 'harper.js/binaryInlined';
          import {createEngine,createHarper,createVirastar} from 'procurement-writing-engine';
          import {createLocalLanguageTool} from 'procurement-writing-engine/node';
          assert.equal(typeof createLocalLanguageTool,'function');
          const harper=await createHarper({binary:binaryInlined,worker:false});
          try {
            const engine=createEngine([harper.provider,await createVirastar()]);
            const prose='Please send teh quotation for ';
            const technical='ABC999';
            const text=prose+technical;
            const r=await engine.analyze({text,snapshotId:'npm-smoke',regions:[{start:0,end:prose.length,kind:'prose',language:'en'},{start:prose.length,end:text.length,kind:'protected'}]});
            assert.equal(r.status,'complete');
            assert.equal(r.apply,false);
            assert.ok(r.findings.some(x=>x.original==='teh'&&x.replacement==='the'));
            assert.ok(r.findings.every(x=>x.start>=0&&x.end<=prose.length&&text.slice(x.start,x.end)===x.original));
            const fa='لطفا مدارك فني را ارسال کنید.';
            const f=await engine.analyze({text:fa,snapshotId:'npm-fa-smoke',regions:[{start:0,end:fa.length,kind:'prose',language:'fa'}]});
            assert.equal(f.status,'complete');
            assert.equal(f.apply,false);
            assert.ok(f.findings.some(x=>x.original==='لطفا'&&x.replacement==='لطفاً'));
          } finally {await harper.dispose();}
          JS
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          cp procurement-writing-engine-0.1.0-alpha.6.tgz "$GITHUB_WORKSPACE/release-artifacts/"
      - name: Dependency inventory
        run: |
          mkdir -p release-artifacts
          npm sbom --sbom-format cyclonedx > release-artifacts/dependencies.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-distribution
          path: |
            release-artifacts/dependencies.cdx.json
            release-artifacts/procurement-writing-engine-0.1.0-alpha.6.tgz
          retention-days: 14

  release-alpha:
    name: Publish verified GitHub alpha.6
    needs: [contract, upstream-and-browser]
    if: github.repository == 'FireXCore/procurement-writing-engine' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: dependency-inventory
          path: release-artifacts
      - name: Verify exact consumer-tested distribution
        run: |
          test "$(node -p 'require("./package.json").version')" = "0.1.0-alpha.6"
          test "$(node -p 'require("./package.json").private')" = "false"
          npm run release:check
          cd release-artifacts
          test -s procurement-writing-engine-0.1.0-alpha.6.tgz
          test -s dependencies.cdx.json
          sha256sum procurement-writing-engine-0.1.0-alpha.6.tgz dependencies.cdx.json > SHA256SUMS.txt
      - name: Publish immutable prerelease once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.1.0-alpha.6
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing release retained; never overwrite."
            exit 0
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag"; then
            echo "Existing tag requires maintainer review."
            exit 1
          else
            test "$?" -eq 2
          fi
          gh release create "$tag" release-artifacts/procurement-writing-engine-0.1.0-alpha.6.tgz release-artifacts/SHA256SUMS.txt release-artifacts/dependencies.cdx.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Procurement Writing Engine $tag" --notes-file docs/RELEASE_NOTES.md
