name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    name: Core / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
  upstream-and-browser:
    name: Locked upstream / Chromium / security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run typecheck
      - run: npm run test:upstream
      - run: npm run build:demo
      - run: npm run test:browser
      - run: npm audit --audit-level=high
      - run: npm run release:check
      - name: Dependency inventory
        run: |
          mkdir -p release-artifacts
          npm sbom --sbom-format cyclonedx > release-artifacts/dependencies.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-inventory
          path: release-artifacts/dependencies.cdx.json
          retention-days: 14
