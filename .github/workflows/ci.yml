name: CI
on:
  push:
    branches: [main, 'dev/alpha-5-acceptance']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    name: Core / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
  upstream-and-browser:
    name: Locked upstream / Chromium / security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run typecheck
      - run: npm run test:upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: language-qualification
          path: qualification-artifacts/*.json
          retention-days: 14
      - run: npm run build:demo
      - run: npm run test:browser
      - run: npm audit --audit-level=high
      - run: npm run release:check
      - name: Install packed SDK in clean consumer
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          npm pack --ignore-scripts --pack-destination "$tmp"
          cd "$tmp"
          printf '%s\n' '{"name":"pwe-consumer-smoke","version":"0.0.0","private":true,"type":"module"}' > package.json
          npm install --ignore-scripts --no-audit --no-fund "./procurement-writing-engine-0.1.0-alpha.8.tgz" harper.js@3.2.0 virastar@0.22.1 @textlint/kernel@16.1.3 @textlint/textlint-plugin-text@16.1.3 dictionary-fa@2.0.0
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {binaryInlined} from 'harper.js/binaryInlined';
          import dictionary from 'dictionary-fa';
          import {createLocalReviewProfile,prepareLilakDictionary,createLilakProvider} from 'procurement-writing-engine';
          import {createLocalLanguageTool} from 'procurement-writing-engine/node';
          assert.equal(typeof createLocalLanguageTool,'function');
          const packed=prepareLilakDictionary(dictionary.dic.toString('utf8'),dictionary.aff.toString('utf8'));
          assert.ok(createLilakProvider(packed,{wordFrequencies:[['مشخصات',12]]}).check('مشخسات','fa').some(f=>f.replacement==='مشخصات'));
          const profile=await createLocalReviewProfile({harperBinary:binaryInlined,persianDictionary:packed});
          try {
            const en='Please send teh quotation. ';
            const fa='لطفا مشخسات را ارسال کنید. ';
            const locked='ABC999 150#';
            const text=en+fa+locked;
            const document={text,snapshotId:'packed-alpha8',regions:[{start:0,end:en.length,kind:'prose',language:'en'},{start:en.length,end:en.length+fa.length,kind:'prose',language:'fa'},{start:en.length+fa.length,end:text.length,kind:'protected'}]};
            const r=await profile.analyze(document);
            assert.equal(r.status,'complete');
            assert.equal(r.apply,false);
            for(const [a,b] of [['teh','the'],['لطفا','لطفاً'],['مشخسات','مشخصات']])assert.ok(r.findings.some(f=>f.original===a&&f.replacement===b),a);
            assert.ok(r.findings.every(f=>f.start>=0&&f.end<=en.length+fa.length&&text.slice(f.start,f.end)===f.original));
          } finally {await profile.dispose();}
          assert.equal((await profile.analyze({text:'',snapshotId:'closed',regions:[]})).status,'blocked');
          JS
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          cp procurement-writing-engine-0.1.0-alpha.8.tgz "$GITHUB_WORKSPACE/release-artifacts/"
      - name: Dependency inventory
        run: |
          mkdir -p release-artifacts
          npm sbom --sbom-format cyclonedx > release-artifacts/dependencies.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-distribution
          path: |
            release-artifacts/dependencies.cdx.json
            release-artifacts/procurement-writing-engine-0.1.0-alpha.8.tgz
          retention-days: 14

  browser-compatibility:
    name: Cross-browser / ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npx --no-install playwright-core install --with-deps ${{ matrix.browser }}
      - run: npm run build:demo
      - run: npm run test:browser
        env:
          PWE_BROWSER: ${{ matrix.browser }}

  release-alpha:
    name: Publish verified GitHub alpha.8
    needs: [contract, upstream-and-browser, browser-compatibility]
    if: github.repository == 'FireXCore/procurement-writing-engine' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: verified-distribution
          path: release-artifacts
      - name: Verify exact consumer-tested distribution
        run: |
          test "$(node -p 'require("./package.json").version')" = "0.1.0-alpha.8"
          test "$(node -p 'require("./package.json").private')" = "false"
          npm run release:check
          cd release-artifacts
          test -s procurement-writing-engine-0.1.0-alpha.8.tgz
          test -s dependencies.cdx.json
          sha256sum procurement-writing-engine-0.1.0-alpha.8.tgz dependencies.cdx.json > SHA256SUMS.txt
      - name: Publish immutable prerelease once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.1.0-alpha.8
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing release retained; never overwrite."
            exit 0
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag"; then
            echo "Existing tag requires maintainer review."
            exit 1
          else
            test "$?" -eq 2
          fi
          gh release create "$tag" release-artifacts/procurement-writing-engine-0.1.0-alpha.8.tgz release-artifacts/SHA256SUMS.txt release-artifacts/dependencies.cdx.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Procurement Writing Engine $tag" --notes-file docs/RELEASE_NOTES.md
